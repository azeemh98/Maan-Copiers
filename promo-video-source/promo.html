<!doctype html>
<html><head><meta charset="utf-8"><title>Maan Copiers Promo</title>
<script src="qr.js"></script>
<style>
:root{--red:#D7263D;--red2:#FF5A6B;--ink:#16181D;--mut:#6B7280;--line:#ECE8E4;--green:#12A150;--g2:#22C55E;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:var(--ink)}
#stage{position:relative;width:540px;height:960px;overflow:hidden;background:#FBF8F6}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75}
.b1{width:420px;height:420px;background:#FFC9CF;left:-120px;top:-80px;animation:drift1 56s linear 0s both}
.b2{width:380px;height:380px;background:#FFE3BF;right:-140px;top:260px;animation:drift2 56s linear 0s both}
.b3{width:440px;height:440px;background:#CDEFD9;left:-100px;bottom:-140px;animation:drift3 56s linear 0s both}
.b4{width:300px;height:300px;background:#D8E4FF;right:-60px;bottom:120px;animation:drift1 56s linear 0s reverse both;opacity:.5}
@keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(90px,120px)}100%{transform:translate(0,40px)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-120px,-60px)}100%{transform:translate(-30px,80px)}}
@keyframes drift3{0%{transform:translate(0,0)}50%{transform:translate(120px,-90px)}100%{transform:translate(40px,0)}}

/* timeline machinery: every animation is offset by the scene start --s */
.scene{position:absolute;inset:0;animation:sOn .35s ease calc(var(--s)) both, sOff .3s ease calc(var(--s) + var(--d) - .3s) forwards}
@keyframes sOn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes sOff{from{opacity:1}to{opacity:0;transform:scale(1.02)}}
.a{animation-duration:var(--dur,.5s);animation-delay:calc(var(--s) + var(--at,0s));animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.9,.3,1.25)}
.pop{animation-name:pop}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.up{animation-name:up}@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.dn{animation-name:dn}@keyframes dn{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
.fade{animation-name:fade;animation-timing-function:ease}@keyframes fade{from{opacity:0}to{opacity:1}}
.fromL{animation-name:fromL}@keyframes fromL{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
.fromR{animation-name:fromR}@keyframes fromR{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:none}}
.win{animation:wOn .22s ease calc(var(--s) + var(--at,0s)) both, wOff .22s ease calc(var(--s) + var(--to,99s)) forwards}
@keyframes wOn{from{opacity:0}to{opacity:1}}@keyframes wOff{from{opacity:1}to{opacity:0}}
.abs{position:absolute}

/* caption pill */
.cap{position:absolute;left:50%;top:842px;transform:translateX(-50%);white-space:nowrap}
.cap .pill{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;font:800 21px/1 'Inter Display',Inter;letter-spacing:.04em;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.p-red{background:var(--red);color:#fff}.p-green{background:var(--green);color:#fff}.p-white{background:#fff;color:var(--ink)}
.p-red:before,.p-green:before{background:#fff}.p-white:before{background:var(--red)}

/* printer */
.printer{position:absolute;width:230px;height:200px}
.pr-top{position:absolute;left:10px;right:10px;top:0;height:34px;background:linear-gradient(#fff,#F1EFED);border-radius:10px 10px 4px 4px;box-shadow:0 2px 0 #E3DEDA}
.pr-lid{position:absolute;left:16px;top:8px;width:120px;height:10px;border-radius:4px;background:#E7E3DF}
.pr-disp{position:absolute;right:14px;top:6px;width:62px;height:22px;border-radius:5px;background:#1E2229;color:#5CF08B;font:700 12px/22px 'JetBrains Mono';text-align:center;box-shadow:inset 0 0 0 2px #333}
.pr-body{position:absolute;left:0;right:0;top:32px;height:150px;background:linear-gradient(#fff,#F4F2F0);border-radius:12px;box-shadow:0 18px 40px rgba(30,20,20,.14),inset 0 -3px 0 #E8E4E0}
.pr-stripe{position:absolute;left:0;right:0;top:12px;height:5px;background:var(--red)}
.pr-slot{position:absolute;left:24px;right:24px;top:30px;height:6px;border-radius:3px;background:#D9D4CF}
.pr-tray{position:absolute;left:22px;right:22px;height:28px;border-radius:6px;background:#F7F5F3;box-shadow:inset 0 0 0 1.5px #E5E0DB}
.pr-tray:after{content:"A4";position:absolute;right:10px;top:7px;font:600 10px Inter;color:#B5ADA7}
.pr-tray i{position:absolute;left:50%;top:11px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:#DED8D3}
.pr-led{position:absolute;left:30px;top:52px;width:8px;height:8px;border-radius:50%;background:var(--g2);box-shadow:0 0 8px var(--g2)}
.pr-out{position:absolute;right:-46px;top:62px;width:70px;height:8px;border-radius:3px;background:#E3DEDA;transform:skewY(-8deg)}
.pr-feet{position:absolute;left:18px;right:18px;bottom:6px;display:flex;justify-content:space-between}
.pr-feet b{width:14px;height:14px;border-radius:50%;background:#555;box-shadow:inset 0 0 0 4px #888}
.sheet-out{position:absolute;right:-60px;top:40px;width:70px;height:46px;background:#fff;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation-name:sheetOut;animation-timing-function:ease-out}
.sheet-out:before{content:"";position:absolute;left:8px;right:8px;top:8px;height:4px;background:var(--red);border-radius:2px;opacity:.7}
.sheet-out:after{content:"";position:absolute;left:8px;right:16px;top:18px;height:14px;background:repeating-linear-gradient(#DDD 0 2px,transparent 2px 6px)}
@keyframes sheetOut{0%{opacity:0;transform:translate(-60px,4px)}20%{opacity:1}100%{opacity:1;transform:translate(10px,30px) rotate(8deg)}}

/* phone */
.phone{position:absolute;width:290px;height:600px;border-radius:44px;background:#15171C;padding:10px;box-shadow:0 40px 80px rgba(40,10,20,.25),inset 0 0 0 2px #2C2F36}
.scr{position:relative;width:100%;height:100%;border-radius:35px;background:#fff;overflow:hidden}
.sb{display:flex;justify-content:space-between;padding:12px 22px 0;font:700 12px Inter}
.island{position:absolute;left:50%;top:9px;width:86px;height:24px;margin-left:-43px;border-radius:14px;background:#15171C;z-index:3}
.apphd{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.mark{width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font:900 14px/26px 'Inter Display';text-align:center}
.apphd b{font:800 13px Inter;letter-spacing:.02em}.apphd small{display:block;font:500 9px Inter;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:6px;padding:0 16px 10px;font:600 9px Inter;color:var(--mut)}
.stepper .d{width:16px;height:16px;border-radius:50%;background:#EEE;color:#888;font:700 9px/16px Inter;text-align:center}
.stepper .on .d{background:var(--red);color:#fff}.stepper .ok .d{background:var(--green);color:#fff}
.stepper .ln{flex:1;height:2px;background:#EEE}.stepper .on{color:var(--ink)}
.screen{position:absolute;left:0;right:0;top:44px;bottom:0;background:#fff}
.hero{margin:6px 14px;border-radius:16px;background:linear-gradient(135deg,var(--red),#A3122A);color:#fff;padding:16px}
.hero h3{font:800 20px/1.1 'Inter Display'}.hero p{font:500 10px/1.4 Inter;opacity:.85;margin-top:6px}
.drop{margin:12px 14px;border:2px dashed #F2B8C0;border-radius:16px;padding:22px 10px;text-align:center;background:#FFF6F7}
.drop .ic{width:42px;height:42px;margin:0 auto 8px;border-radius:12px;background:var(--red);color:#fff;font:700 24px/42px Inter}
.drop b{font:700 13px Inter;display:block}.drop small{font:500 9px Inter;color:var(--mut)}
.how{display:flex;gap:6px;margin:6px 14px}.how div{flex:1;border-radius:12px;background:#F7F5F3;padding:9px 6px;text-align:center;font:600 8.5px Inter;color:var(--mut)}
.how div b{display:block;font:800 15px Inter;color:var(--red);margin-bottom:2px}
.fcard{margin:10px 14px;border-radius:14px;border:1px solid var(--line);padding:12px;display:flex;gap:10px;align-items:center}
.pdf{width:34px;height:42px;border-radius:6px;background:#FFE8EB;color:var(--red);font:800 8px/42px Inter;text-align:center;flex:none}
.fcard b{font:700 11px Inter;display:block}.fcard small{font:500 9px Inter;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:#F1EEEB;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--red);border-radius:3px;animation-name:grow;animation-timing-function:ease-in-out}
@keyframes grow{from{width:0}to{width:100%}}
.sec{margin:8px 14px 0;font:700 9px Inter;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.seg{position:relative;display:flex;margin:5px 14px 0;background:#F3F1EF;border-radius:10px;padding:3px}
.seg span{flex:1;position:relative;z-index:1;text-align:center;font:700 10px/24px Inter}
.seg .hl{position:absolute;top:3px;bottom:3px;border-radius:8px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;margin:8px 14px 0;font:600 10.5px Inter}
.tog{width:36px;height:21px;border-radius:11px;background:#DDD;position:relative}
.tog i{position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.stepx{display:flex;align-items:center;gap:10px;font:700 11px Inter}.stepx b{width:22px;height:22px;border-radius:7px;background:#F3F1EF;text-align:center;line-height:22px}
.tiles{display:flex;gap:7px;margin:5px 14px 0}
.tile{flex:1;height:46px;border-radius:10px;border:1.5px solid var(--line);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 8.5px Inter;color:var(--mut)}
.tile .g{display:grid;gap:1.5px;width:16px;height:20px}.tile .g i{background:#C9C2BC;border-radius:1px}
.ring{position:absolute;inset:-1.5px;border:2px solid var(--red);border-radius:10px;background:rgba(215,38,61,.06)}
.paybar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 16px;border-top:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:10px}
.paybar .amt{position:relative;width:80px;height:34px}
.paybar .amt div{position:absolute;left:0;top:0}
.paybar .amt b{font:800 18px Inter;display:block}.paybar .amt small{font:500 8.5px Inter;color:var(--mut);white-space:nowrap}
.paybtn{flex:1;height:40px;border-radius:12px;background:var(--red);color:#fff;font:700 11px/40px Inter;text-align:center;position:relative}
.tap{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(215,38,61,.55);animation-name:tap;animation-duration:.8s!important;animation-timing-function:ease-out!important}
@keyframes tap{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.6)}}
/* preview */
.pv{margin:2px 14px 0;height:150px;border-radius:14px;background:#F4F2EF;position:relative;overflow:hidden}
.psheet{position:absolute;left:50%;top:10px;width:96px;height:130px;margin-left:-48px;background:#fff;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:5px;display:grid;gap:4px}
.mini{background:#fff;border:1px solid #EEE;border-radius:2px;padding:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.mini .t{height:10%;min-height:2px;background:var(--red);border-radius:1px;width:60%}
.mini .l{height:3%;min-height:1px;background:#CFCAC5;border-radius:1px}
.mini .c{flex:1;border-radius:2px;background:linear-gradient(135deg,#FF8A5B,#E0306B 60%,#7B5CFF)}
.gs{animation:gsOn .4s ease calc(var(--s) + var(--at)) both}@keyframes gsOn{from{filter:none}to{filter:grayscale(1)}}
.pvl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:600 8px Inter;color:var(--mut)}

/* generic cards */
.card{position:absolute;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(60,20,30,.14)}
.qrbox{background:#fff;border-radius:24px;padding:14px;box-shadow:0 24px 60px rgba(60,20,30,.18);color:var(--red)}
.qrbox svg{display:block;width:100%;height:100%}
.chk{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:18px 26px;box-shadow:0 14px 40px rgba(0,0,0,.1);font:800 30px 'Inter Display';letter-spacing:.01em}
.chk i{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font:900 22px/40px Inter;text-align:center;font-style:normal}
.qm{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;font:900 24px/44px Inter;text-align:center;box-shadow:0 6px 18px rgba(215,38,61,.4)}
.h1{font:900 46px/1 'Inter Display';letter-spacing:-.01em;text-align:center}
.h1 em{font-style:normal;color:var(--red)}
.pin{position:absolute;width:22px;height:34px}
.pin:before{content:"";position:absolute;left:5px;top:0;width:12px;height:12px;border-radius:50%;background:#F2C9A5}
.pin:after{content:"";position:absolute;left:2px;top:13px;width:18px;height:20px;border-radius:9px 9px 6px 6px;background:var(--c)}
.pin i{position:absolute;left:-2px;bottom:-5px;width:26px;height:8px;border-radius:50%;background:var(--c);opacity:.35}
</style></head>
<body><div id="stage">
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<div id="scenes"></div>
</div>
<script>
const QR = window.QR_SVG;
const printer = (x,y,s,disp,extra='') => `<div class="printer" style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:0 0">
 <div class="pr-top"><div class="pr-lid"></div><div class="pr-disp">${disp}</div></div>
 <div class="pr-body"><div class="pr-stripe"></div><div class="pr-slot"></div><div class="pr-led"></div>
 <div class="pr-tray" style="top:72px"><i></i></div><div class="pr-tray" style="top:106px"><i></i></div><div class="pr-out"></div>${extra}</div>
 <div class="pr-feet" style="top:178px"><b></b><b></b></div></div>`;
const sheets = (ats) => ats.map(t=>`<div class="sheet-out a" style="--at:${t}s;--dur:1.1s"></div>`).join('');
const cap = (txt, cls, at, to) => `<div class="cap win" style="--at:${at}s;--to:${to}s"><div class="pill ${cls} a pop" style="--at:${at}s;--dur:.45s">${txt}</div></div>`;
const mini = n => Array.from({length:n},()=>`<div class="mini"><div class="t"></div><div class="l"></div><div class="l" style="width:80%"></div><div class="c"></div><div class="l"></div><div class="l" style="width:70%"></div></div>`).join('');
const statusbar = `<div class="island"></div><div class="sb"><span>9:41</span><span>●●● ▮</span></div>`;
const apphd = `<div class="apphd"><div class="mark">M</div><div><b>MAAN COPIERS</b><small>Smart QR Print</small></div></div>`;
const stepper = (st) => {const n=['Upload','Settings','Pay'];return `<div class="stepper">${n.map((x,i)=>`<span class="${i<st?'ok':i==st?'on':''}" style="display:flex;align-items:center;gap:4px"><span class="d">${i<st?'✓':i+1}</span>${x}</span>${i<2?'<span class="ln"></span>':''}`).join('')}</div>`};
function rnd(seed){let s=seed;return()=>((s=(s*9301+49297)%233280)/233280)}

const S = [];
const add = (start,dur,html) => S.push(`<div class="scene" style="--s:${start}s;--d:${dur}s">${html}</div>`);

/* 1 — rush at counter */
(()=>{const r=rnd(7);const cols=['#E8414F','#1FA463','#2C7BE5','#F28C28','#8B5CF6','#E64980','#0EA5A4'];let pins='';
 for(let i=0;i<42;i++){const x=40+r()*440,y=330+r()*380;pins+=`<div class="pin a pop" style="left:${x}px;top:${y}px;--c:${cols[i%7]};--at:${.6+i*.045}s;--dur:.35s"><i></i></div>`}
 add(0,4.2,`
 <div class="card a up" style="left:30px;top:90px;width:480px;height:650px;background:rgba(255,255,255,.85);--at:0s;
   background-image:linear-gradient(#EFEAE6 1px,transparent 1px),linear-gradient(90deg,#EFEAE6 1px,transparent 1px);background-size:24px 24px"></div>
 <div class="abs a dn" style="left:52px;top:120px;width:436px;height:56px;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);--at:.15s"></div>
 ${printer(70,140,.62,'BUSY')}
 <div class="abs a pop" style="left:340px;top:150px;width:120px;height:74px;border-radius:10px;background:#1E2229;border:5px solid #2D323B;--at:.3s"><div style="margin:8px;height:8px;border-radius:3px;background:#E8414F"></div><div style="margin:0 8px;height:4px;background:#555;width:60%"></div></div>
 <div class="abs a pop" style="left:22px;top:110px;--at:1.6s"><div style="display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;border-radius:999px;padding:10px 18px;font:800 20px 'Inter Display';box-shadow:0 10px 24px rgba(215,38,61,.35)">👥 50 STUDENTS</div></div>
 ${pins}
 <div class="abs a up" style="left:0;right:0;top:770px;text-align:center;font:800 26px 'Inter Display';--at:.4s">Exam season. <span style="color:var(--red)">Ek counter.</span></div>
 ${cap('RUSH HI RUSH','p-red',.3,99)}`)})();

/* 2 — WhatsApp chaos */
(()=>{let rows='';const names=['Notes_final.pdf','IMG_2041.jpg','assignment (3).pdf','Resume_new.docx','Lab_record.pdf','scan0001.pdf','project_FINAL_final.pdf','photo.jpeg'];
 names.forEach((n,i)=>{const me=i%2;rows+=`<div class="a ${me?'fromR':'fromL'}" style="--at:${.25+i*.18}s;display:flex;${me?'justify-content:flex-end':''};margin:7px 16px">
  <div style="display:flex;align-items:center;gap:8px;background:${me?'#E3F9EA':'#F5F3F1'};border-radius:12px;padding:8px 10px;width:250px">
  <div class="pdf" style="width:26px;height:32px;line-height:32px;font-size:7px">${n.split('.').pop().toUpperCase()}</div>
  <div><b style="font:700 11px Inter;display:block">${n}</b><small style="font:500 9px Inter;color:#888">${(i*1.7+0.6).toFixed(1)} MB · ${9+i}:4${i} AM</small></div></div></div>`});
 const qs=[[70,150,1.2],[420,120,1.5],[40,420,1.8],[440,380,2.0],[80,640,2.2],[410,640,2.4],[250,90,2.6]];
 add(4.2,3.6,`
 <div class="card a up" style="left:70px;top:100px;width:400px;height:640px;overflow:hidden;--at:0s">
  <div style="display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)"><div style="width:34px;height:34px;border-radius:50%;background:#25B35A"></div><div><b style="font:700 13px Inter">Xerox Shop 📎</b><br><small style="font:500 10px Inter;color:#888">typing…</small></div>
  <div style="margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:3px 8px;font:800 11px Inter">99+</div></div>${rows}</div>
 ${qs.map(([x,y,t])=>`<div class="qm a pop" style="left:${x}px;top:${y}px;--at:${t}s">?</div>`).join('')}
 ${cap('FILES ON WHATSAPP','p-green',.1,1.7)}${cap('KISKI FILE?','p-white',1.7,99)}`)})();

/* 3 — wrong print */
add(7.8,3.6,`
 <div class="abs win" style="--at:0s;--to:1.5s">
  <div class="card a dn" style="left:170px;top:110px;width:200px;height:250px;padding:16px;--at:0s">
   <div style="height:12px;width:40px;border-radius:4px;background:#FFE0E4;font:800 7px/12px Inter;color:var(--red);text-align:center">PDF</div>
   <div style="height:90px;margin-top:10px;border-radius:6px;background:linear-gradient(135deg,#FF8A5B,#E0306B)"></div>
   <div style="height:6px;margin-top:10px;background:#E5E1DD;border-radius:3px"></div><div style="height:6px;margin-top:6px;width:70%;background:#E5E1DD;border-radius:3px"></div>
   <div class="a pop" style="position:absolute;left:24px;top:120px;transform:rotate(-12deg);--at:.5s"><div style="transform:rotate(-12deg);border:4px solid var(--green);color:var(--green);background:#fff;border-radius:10px;padding:6px 14px;font:900 30px 'Inter Display'">1 SIDE</div></div>
  </div></div>
 <div class="abs win" style="--at:1.5s;--to:2.7s">
  <div class="card" style="left:300px;top:140px;width:170px;height:210px;padding:14px;transform:rotate(6deg)">
   <div style="height:80px;border-radius:6px;background:linear-gradient(135deg,#FF8A5B,#E0306B);opacity:.5"></div>
